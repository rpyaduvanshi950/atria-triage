# ATRIA — local development stack.
#
# A developer should be able to reach a working nurse-first assessment screen
# within one `docker compose up`, using only synthetic data and no production
# credentials — this is the literal "definition of done" bar from PRD §21.1.
#
# Usage:
#   docker compose up -d db redis
#   docker compose up api guardrail-service inference-service web
#
# Or simply:
#   docker compose up

services:
  # --- data stores -----------------------------------------------------------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: atria
      POSTGRES_USER: atria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atria_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atria"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- backend services (all from the same image for the prototype) ----------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      uvicorn service.app:app
      --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://atria:${POSTGRES_PASSWORD:-atria_dev}@db:5432/atria
      REDIS_URL: redis://redis:6379/0
      ATRIA_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:8501"
      JWT_SECRET: ${JWT_SECRET:-atria_dev_secret_not_for_production}
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The guardrail service is the same code but conceptually separate.
  # In production it would be its own deployment with zero DB dependency.
  guardrail-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      python -c "
      from layer0.engine import gate, RuleTable;
      print(f'Guardrail service ready: {len(RuleTable().rules)} rules, v{RuleTable().version}');
      import time; time.sleep(999999)
      "
    volumes:
      - .:/app

  # The inference service wraps the ML model.
  inference-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      python -c "
      from data.loaders.synthetic import generate;
      from layer1.model import AcuityScorer;
      s = AcuityScorer().fit(generate(1500, seed=3));
      print(f'Inference service ready: {s.metrics}');
      import time; time.sleep(999999)
      "
    volumes:
      - .:/app

  # --- frontend --------------------------------------------------------------
  web:
    build:
      context: ./atria-web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    depends_on:
      - api

  # Streamlit alternative frontend
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      streamlit run streamlit_app.py
      --server.address 0.0.0.0
      --server.port 8501
      --server.headless true
    ports:
      - "8501:8501"
    volumes:
      - .:/app

volumes:
  pgdata:
