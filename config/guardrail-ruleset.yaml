# ATRIA Layer 0 — deterministic red-flag gate.
#
# Ten hard rules. No model output can suppress a fired flag; only a licensed
# clinician can (Layer 3). This file is versioned and every entry carries its own
# clinical citation, so any rule can be defended individually.
#
# Missing-value policy, and why it is split:
#   worst_case  — numeric physiological fields. An unrecorded SpO2 is gated as if
#                 it were dangerous. "Unknown is not normal."
#   absent      — witnessed events (seizure, haemorrhage). Absence of an
#                 observation is not evidence of the event, and imputing these to
#                 "true" would fire every rule on every patient with a blank form.
version: "0.3.0"

# Meta-rules. These do not test a vital against a threshold — they test whether
# the system is entitled to answer at all. Implemented in engine.py because they
# reason over the whole record rather than one field, and listed here so the rule
# table remains the single auditable statement of what the gate does.
meta_rules:
  - id: RF11
    name: Insufficient data to triage
    trigger: fewer than 3 of the monitored vitals are recorded
    action: hard stop — no score is produced, the patient is routed to a clinician
    rationale: >
      Below a floor of observations any score is an assertion about a patient
      nobody has examined. Overtriaging on absent data looks useful and is not:
      it consumes the attention of a department that has none to spare, and it
      teaches staff that the board can be ignored.
    citation: "Clinical review, Round 2 design consultation."

  - id: RF12
    name: Ambiguous presentation — cannot classify
    trigger: two or more atria mortis pathways are engaged with near-equal severity
    action: abstain from ranking within band; escalate for urgent clinician review
    rationale: >
      Diagnostic uncertainty is not triage uncertainty. A patient may be
      unambiguously critical while nobody can say whether it is the heart, the
      lungs or the brain. That patient needs a doctor now, not a better score,
      and the system should say so rather than manufacture a confident answer.
    citation: "Clinical review, Round 2 design consultation."

worst_case:
  gcs: 3
  o2sat: 85
  sbp: 80
  resprate: 34
  heartrate: 130
  temperature: 35.0

rules:
  - id: RF01
    name: Severe depression of consciousness
    all_of: [{field: gcs, op: le, value: 8}]
    missing_policy: worst_case
    rationale: GCS <=8 indicates inability to protect the airway.
    citation: "Advanced Trauma Life Support, 10th ed. — GCS <=8 is the conventional intubation threshold."

  - id: RF02
    name: Critical hypoxaemia
    all_of: [{field: o2sat, op: lt, value: 90}]
    missing_policy: worst_case
    rationale: SpO2 <90% marks the steep part of the oxyhaemoglobin dissociation curve.
    citation: "NEWS2, Royal College of Physicians 2017 — SpO2 <=91% scores 3, the maximum single-parameter score."

  - id: RF03
    name: Hypotension / shock
    # Age-banded, not a single adult number: 90 mmHg for adults, 70 + 2*age for
    # children 1-10, 70 under one year, 60 under one month.
    all_of: [{field: sbp, op: lt, value_fn: sbp_hypotension}]
    missing_policy: worst_case
    rationale: >
      Systolic hypotension by age. Applying the adult 90 mmHg threshold to
      children produces both false alarms and, at the other end, missed shock.
    citation: "NEWS2, RCP 2017 (adult); PALS age-specific hypotension thresholds, AHA 2020 (paediatric)."

  - id: RF13
    name: Respiratory rate outside the age-appropriate range
    # Adult <10 or >30/min. Age-banded rather than a single adult pair, because
    # a respiratory rate of 32 is an emergency in an adult and normal in a
    # toddler. PRD SAF-004 and Appendix A.
    any_of:
      - all_of: [{field: resprate, op: lt, value_fn: resprate_low}]
      - all_of: [{field: resprate, op: gt, value_fn: resprate_high}]
    missing_policy: worst_case
    rationale: >
      Respiratory rate is the earliest vital to move in deterioration and the
      most often left unrecorded. Both bradypnoea and tachypnoea are critical.
    citation: "NEWS2, RCP 2017 — RR <=8 or >=25 scores 3. PALS age-specific ranges, AHA 2020."

  - id: RF04
    name: Active seizure
    all_of: [{field: active_seizure, op: is_true}]
    missing_policy: absent
    rationale: Ongoing seizure activity is a time-critical neurological emergency.
    citation: "Glauser et al., Epilepsy Currents 2016 — treat as status epilepticus at 5 minutes of continuous activity."

  - id: RF05
    name: Airway compromise
    all_of: [{field: airway_compromise, op: is_true}]
    missing_policy: absent
    rationale: Stridor, obstruction or inability to maintain the airway. Airway precedes all else.
    citation: "ATLS 10th ed. — airway is the first primary-survey priority."

  - id: RF06
    name: Uncontrolled haemorrhage
    all_of: [{field: uncontrolled_haemorrhage, op: is_true}]
    missing_policy: absent
    rationale: Exsanguinating bleeding not controlled by direct pressure.
    citation: "ATLS 10th ed., circulation with haemorrhage control."

  - id: RF07
    name: Anaphylaxis
    all_of: [{field: anaphylaxis, op: is_true}]
    missing_policy: absent
    rationale: Rapidly progressive multi-system hypersensitivity; adrenaline is time-critical.
    citation: "Muraro et al., EAACI Guidelines, Allergy 2014."

  - id: RF08
    name: Stroke signs within treatment window
    all_of:
      - {field: stroke_signs, op: is_true}
      - {field: symptom_onset_minutes, op: le, value: 270}
    missing_policy: absent
    rationale: FAST-positive within 4.5 hours preserves thrombolysis eligibility.
    citation: "Powers et al., AHA/ASA Guidelines, Stroke 2019 — alteplase window 4.5h from onset."

  - id: RF09
    name: Eclampsia / pre-eclampsia with seizure
    all_of: [{field: eclampsia, op: is_true}]
    missing_policy: absent
    rationale: Obstetric emergency threatening both patient and foetus.
    citation: "WHO Recommendations for Prevention and Treatment of Pre-eclampsia and Eclampsia, 2011."

  - id: RF10
    name: Paediatric respiratory distress with retractions
    all_of:
      - {field: age, op: lt, value: 15}
      - {field: retractions, op: is_true}
    missing_policy: absent
    rationale: Intercostal or subcostal recession signals impending respiratory failure in children.
    citation: "WHO Pocket Book of Hospital Care for Children, 2nd ed. 2013 — chest indrawing as an emergency sign."
